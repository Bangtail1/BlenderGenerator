[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-asset-vault"
version = "0.1.0"
description = "Autonomous local-first Blender 3D Asset Library with Technical QA, Multi-angle Visual QA, Human Approval Gate, and Google Drive Sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
blender-vault = "blender_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
